name: Release

# Pushing a tag like v0.3.0 runs the checks, builds the package, and publishes a
# GitHub Release with generated notes, the wheel, and the source distribution.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UV_LOCKED: "1"

jobs:
  release:
    name: Check, build, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "tiny-agent $GITHUB_REF_NAME"
