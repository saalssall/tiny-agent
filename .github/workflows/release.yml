name: Release

# Pushing a tag like v0.1.0 runs the tests, then publishes a GitHub Release
# with auto-generated notes and a source archive of the project.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-ml.txt ruff
      - run: ruff check .
      - run: python -m unittest -v

  release:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: git archive --format=zip --prefix=tiny-agent/ -o "tiny-agent-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "tiny-agent-${GITHUB_REF_NAME}.zip" --generate-notes --title "tiny-agent $GITHUB_REF_NAME"
