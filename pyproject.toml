[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tiny-agent"
version = "0.3.0"
description = "A small Claude-powered agent for your terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.6"]
keywords = ["claude", "agent", "cli", "anthropic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.scripts]
tiny-agent = "tiny_agent.cli:main"

[project.urls]
Repository = "https://github.com/saalssall/tiny-agent"
Changelog = "https://github.com/saalssall/tiny-agent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "coverage>=7.6",
  "pre-commit>=3.8",
]
ml = ["scikit-learn>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["tiny_agent"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = [
  "RUF001",  # we deliberately use unicode glyphs (›, ▸, ✓) in terminal output
  "RUF012",  # Tool subclasses override attributes declared ClassVar on the base class
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tiny_agent", "tests"]  # ml/ scripts lean on untyped scientific libraries
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests: check bodies, but don't demand a signature on every helper.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tiny_agent"]
branch = true
omit = ["tiny_agent/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
